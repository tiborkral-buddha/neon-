<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Neon Snake: Cyber Rush</title>

    <!-- CRAZYGAMES SDK v3 -->
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 50% 30%, #102041 0%, #060913 55%, #02040a 100%);
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .hud {
            min-height: 64px;
            display: flex;
            justify-content: center;
            gap: 45px;
            align-items: center;
            padding: 12px 20px;
            background: rgba(8, 14, 30, 0.95);
            border-bottom: 2px solid #00ff66;
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(0, 255, 102, 0.12);
            z-index: 5;
        }

        .hud-box {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .hud-box span {
            color: #00ff66;
            text-shadow: 0 0 12px rgba(0, 255, 102, 0.7);
        }

        #best-text {
            height: 28px;
            padding-top: 5px;
            font-size: 13px;
            color: #718096;
            text-align: center;
        }

        #best-score {
            color: #ffd54a;
            font-weight: bold;
        }

        #canvas-container {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        canvas {
            height: 100%;
            width: auto;
            max-width: 100%;
            max-height: 100%;
            background: #040711;
            border: 3px solid #00ff66;
            border-radius: 14px;
            box-shadow:
                0 0 12px rgba(0, 255, 102, 0.5),
                0 0 35px rgba(0, 255, 102, 0.15);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at center,
                    rgba(12, 29, 48, 0.96),
                    rgba(3, 6, 15, 0.98));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 25px;
        }

        .logo {
            font-size: clamp(38px, 9vw, 72px);
            line-height: 0.95;
            font-weight: 1000;
            margin: 0;
            color: #00ff66;
            letter-spacing: 2px;
            text-align: center;
            text-shadow:
                0 0 8px rgba(0, 255, 102, 0.8),
                0 0 30px rgba(0, 255, 102, 0.35);
        }

        .rush {
            color: #38bdf8;
            text-shadow:
                0 0 8px rgba(56, 189, 248, 0.8),
                0 0 30px rgba(56, 189, 248, 0.35);
        }

        #menuSub {
            max-width: 420px;
            margin: 22px 0 28px;
            color: #a0aec0;
            line-height: 1.6;
            font-size: 16px;
            text-align: center;
        }

        .main-button {
            min-width: 190px;
            padding: 15px 38px;
            border: 0;
            border-radius: 10px;
            background: #00ff66;
            color: #031008;
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow:
                0 5px 20px rgba(0, 255, 102, 0.4),
                inset 0 1px rgba(255, 255, 255, 0.5);
            transition: transform 0.12s ease;
        }

        .main-button:hover {
            transform: scale(1.04);
        }

        .main-button:active {
            transform: scale(0.96);
        }

        #finalScore {
            margin-top: 14px;
            font-weight: bold;
            color: #ffd54a;
            font-size: 21px;
        }

        .controls {
            margin-top: 25px;
            color: #53647d;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .hud {
                min-height: 55px;
                gap: 30px;
                padding: 9px;
            }

            .hud-box {
                font-size: 16px;
            }

            #best-text {
                height: 24px;
                font-size: 12px;
            }

            #canvas-container {
                padding: 5px;
            }
        }
    </style>
</head>

<body>

<div class="game-wrapper">

    <div class="hud">
        <div class="hud-box">
            SCORE:
            <span id="skore">0</span>
        </div>

        <div class="hud-box">
            LEVEL:
            <span id="level">1</span>
        </div>
    </div>

    <div id="best-text">
        🏆 BEST:
        <span id="best-score">0</span>
    </div>

    <div id="canvas-container">
        <canvas
            id="gameCanvas"
            width="360"
            height="540">
        </canvas>
    </div>

</div>


<div id="menuOverlay" class="overlay">

    <h1 class="logo">
        NEON SNAKE<br>
        <span class="rush">CYBER RUSH</span>
    </h1>

    <p id="menuSub">
        Move left and right.<br>
        Collect energy. Avoid obstacles.
    </p>

    <div id="finalScore"></div>

    <button
        id="startButton"
        class="main-button"
        onclick="tlacitkoStart()">
        PLAY
    </button>

    <div class="controls">
        DESKTOP: mouse / ← →<br>
        MOBILE: drag your finger
    </div>

</div>


<script>

    /* =========================================================
       CANVAS
    ========================================================= */

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const HLAVA_Y = 365;


    /* =========================================================
       GAME STATE
    ========================================================= */

    let hracHad = [];
    let prekazky = [];
    let energie = [];
    let particles = [];

    let skore = 0;
    let level = 1;

    let hraBezi = false;
    let gameLoopId = null;

    let rychlostHry = 3.5;
    let frekvenciaPrekazok = 100;
    let frameCounter = 0;

    let hracX = WIDTH / 2;
    let cielX = WIDTH / 2;

    let audioCtx = null;

    let crazySDKReady = false;


    /* =========================================================
       HIGH SCORE
    ========================================================= */

    let ulozeneBestScore =
        Number(localStorage.getItem("snakeRunnerBest")) || 0;

    document.getElementById("best-score").innerText =
        ulozeneBestScore;


    /* =========================================================
       CRAZYGAMES SDK
    ========================================================= */

    async function initCrazyGames() {

        try {

            if (
                window.CrazyGames &&
                window.CrazyGames.SDK
            ) {

                await window.CrazyGames.SDK.init();

                crazySDKReady = true;

                console.log("CrazyGames SDK ready.");

            }

        } catch (error) {

            /*
            Hra bude fungovať aj lokálne,
            keď SDK nie je dostupné.
            */

            console.log(
                "CrazyGames SDK nie je momentálne dostupné:",
                error
            );

        }
    }

    initCrazyGames();


    function gameplayStart() {

        if (!crazySDKReady) return;

        try {

            window.CrazyGames.SDK.game.gameplayStart();

        } catch (e) {

            console.log(e);

        }

    }


    function gameplayStop() {

        if (!crazySDKReady) return;

        try {

            window.CrazyGames.SDK.game.gameplayStop();

        } catch (e) {

            console.log(e);

        }

    }


    /* =========================================================
       AUDIO
    ========================================================= */

    function initAudio() {

        if (!audioCtx) {

            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (audioCtx.state === "suspended") {

            audioCtx.resume();

        }
    }


    function playTone(
        frequency,
        endFrequency,
        duration,
        volume = 0.08,
        type = "sine"
    ) {

        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;

        osc.frequency.setValueAtTime(
            frequency,
            audioCtx.currentTime
        );

        osc.frequency.exponentialRampToValueAtTime(
            Math.max(1, endFrequency),
            audioCtx.currentTime + duration
        );

        gain.gain.setValueAtTime(
            volume,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + duration
        );

        osc.connect(gain);

        gain.connect(audioCtx.destination);

        osc.start();

        osc.stop(
            audioCtx.currentTime + duration
        );
    }


    function zvukEnergia() {

        playTone(
            550,
            1050,
            0.09,
            0.09,
            "sine"
        );

    }


    function zvukLevelUp() {

        if (!audioCtx) return;

        const tones = [
            523,
            659,
            784,
            1046
        ];

        tones.forEach(
            (frequency, index) => {

                setTimeout(() => {

                    playTone(
                        frequency,
                        frequency * 1.02,
                        0.15,
                        0.08,
                        "triangle"
                    );

                }, index * 90);

            }
        );

    }


    function zvukKoniec() {

        playTone(
            170,
            40,
            0.45,
            0.14,
            "sawtooth"
        );

    }


    /* =========================================================
       PLAYER CONTROL
    ========================================================= */

    function updatePozicie(clientX) {

        if (!hraBezi) return;

        const rect =
            canvas.getBoundingClientRect();

        let relativneX =
            (clientX - rect.left) /
            rect.width *
            canvas.width;

        relativneX =
            Math.max(
                18,
                Math.min(
                    canvas.width - 18,
                    relativneX
                )
            );

        cielX = relativneX;
    }


    window.addEventListener(
        "mousemove",
        event => {

            updatePozicie(
                event.clientX
            );

        }
    );


    window.addEventListener(
        "touchmove",
        event => {

            if (
                hraBezi &&
                event.touches.length > 0
            ) {

                event.preventDefault();

                updatePozicie(
                    event.touches[0].clientX
                );

            }

        },
        {
            passive: false
        }
    );


    window.addEventListener(
        "keydown",
        event => {

            if (!hraBezi) return;

            if (
                event.key === "ArrowLeft" ||
                event.key === "a"
            ) {

                cielX -= 35;

            }

            if (
                event.key === "ArrowRight" ||
                event.key === "d"
            ) {

                cielX += 35;

            }

            cielX =
                Math.max(
                    18,
                    Math.min(
                        WIDTH - 18,
                        cielX
                    )
                );

        }
    );


    /* =========================================================
       START GAME
    ========================================================= */

    function tlacitkoStart() {

        initAudio();

        document.getElementById(
            "menuOverlay"
        ).style.display = "none";

        document.getElementById(
            "finalScore"
        ).innerText = "";

        gameplayStart();

        spustiNovuHru();
    }


    function spustiNovuHru() {

        if (gameLoopId) {

            cancelAnimationFrame(
                gameLoopId
            );

        }

        skore = 0;
        level = 1;

        rychlostHry = 3.5;

        frekvenciaPrekazok = 100;

        frameCounter = 0;

        hracX = WIDTH / 2;
        cielX = WIDTH / 2;

        prekazky = [];
        energie = [];
        particles = [];

        hracHad = [];

        for (
            let i = 0;
            i < 10;
            i++
        ) {

            hracHad.push({

                x: WIDTH / 2,

                y:
                    HLAVA_Y +
                    i * 8

            });

        }

        document.getElementById(
            "skore"
        ).innerText = skore;

        document.getElementById(
            "level"
        ).innerText = level;

        hraBezi = true;

        hernaSlucka();
    }


    /* =========================================================
       SPAWN OBJECTS
    ========================================================= */

    function vytvorObjekty() {

        frameCounter++;

        if (
            frameCounter <
            frekvenciaPrekazok
        ) {

            return;

        }

        frameCounter = 0;


        /* PREKÁŽKA */

        const sirka =
            Math.floor(
                Math.random() * 48
            ) + 38;

        const x =
            Math.random() *
            (
                WIDTH -
                sirka -
                12
            ) +
            6;

        prekazky.push({

            x: x,

            y: -35,

            w: sirka,

            h:
                24 +
                Math.random() * 8

        });


        /* ENERGIA */

        if (
            Math.random() < 0.72
        ) {

            energie.push({

                x:
                    Math.random() *
                    (WIDTH - 50) +
                    25,

                y: -80,

                r: 10,

                pulse:
                    Math.random() *
                    Math.PI * 2

            });

        }

    }


    /* =========================================================
       PARTICLES
    ========================================================= */

    function explosion(
        x,
        y,
        color
    ) {

        for (
            let i = 0;
            i < 14;
            i++
        ) {

            particles.push({

                x,
                y,

                vx:
                    (
                        Math.random() -
                        0.5
                    ) * 5,

                vy:
                    (
                        Math.random() -
                        0.5
                    ) * 5,

                life: 1,

                color

            });

        }

    }


    function updateParticles() {

        particles.forEach(
            particle => {

                particle.x += particle.vx;

                particle.y += particle.vy;

                particle.life -= 0.045;

            }
        );

        particles =
            particles.filter(
                particle =>
                    particle.life > 0
            );

    }


    /* =========================================================
       COLLISIONS
    ========================================================= */

    function kontrolaEnergie() {

        for (
            let i =
                energie.length - 1;

            i >= 0;

            i--
        ) {

            const item =
                energie[i];

            const dx =
                hracX -
                item.x;

            const dy =
                HLAVA_Y -
                item.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            if (
                distance < 24
            ) {

                energie.splice(
                    i,
                    1
                );

                skore++;

                document.getElementById(
                    "skore"
                ).innerText =
                    skore;

                zvukEnergia();

                explosion(
                    item.x,
                    item.y,
                    "#00ffff"
                );


                /* LEVEL */

                const novyLevel =
                    Math.floor(
                        skore / 6
                    ) + 1;

                if (
                    novyLevel >
                    level
                ) {

                    level =
                        novyLevel;

                    document.getElementById(
                        "level"
                    ).innerText =
                        level;

                    rychlostHry =
                        Math.min(
                            9,
                            rychlostHry +
                            0.45
                        );

                    frekvenciaPrekazok =
                        Math.max(
                            48,
                            100 -
                            level * 5
                        );

                    zvukLevelUp();

                }

            }

        }

    }


    function kontrolaPrekazok() {

        for (
            let i = 0;
            i < prekazky.length;
            i++
        ) {

            const p =
                prekazky[i];

            const playerRadius =
                13;

            if (
                hracX +
                playerRadius >
                p.x &&

                hracX -
                playerRadius <
                p.x +
                p.w &&

                HLAVA_Y +
                playerRadius >
                p.y &&

                HLAVA_Y -
                playerRadius <
                p.y +
                p.h
            ) {

                koniecHry();

                return true;

            }

        }

        return false;
    }


    /* =========================================================
       UPDATE
    ========================================================= */

    function updateGame() {

        hracX +=
            (
                cielX -
                hracX
            ) *
            0.16;


        /* HAD */

        hracHad.unshift({

            x: hracX,

            y: HLAVA_Y

        });


        /*
        Had sa postupne predlžuje.
        */

        const cielovaDlzka =
            11 +
            skore * 1.5;

        while (
            hracHad.length >
            cielovaDlzka
        ) {

            hracHad.pop();

        }


        vytvorObjekty();


        prekazky.forEach(
            p => {

                p.y += rychlostHry;

            }
        );


        energie.forEach(
            item => {

                item.y +=
                    rychlostHry;

                item.pulse +=
                    0.12;

            }
        );


        prekazky =
            prekazky.filter(
                p =>
                    p.y <
                    HEIGHT + 50
            );


        energie =
            energie.filter(
                item =>
                    item.y <
                    HEIGHT + 50
            );


        kontrolaEnergie();

        if (
            kontrolaPrekazok()
        ) {

            return;
        }

        updateParticles();

    }


    /* =========================================================
       DRAW BACKGROUND
    ========================================================= */

    function drawBackground() {

        ctx.fillStyle =
            "#040711";

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /* jemný gradient */

        const gradient =
            ctx.createRadialGradient(
                WIDTH / 2,
                HEIGHT / 2,
                20,

                WIDTH / 2,
                HEIGHT / 2,
                350
            );

        gradient.addColorStop(
            0,
            "rgba(0,255,102,0.035)"
        );

        gradient.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle =
            gradient;

        ctx.fillRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /* CYBER GRID */

        ctx.strokeStyle =
            "rgba(0,255,102,0.055)";

        ctx.lineWidth = 1;

        for (
            let x = 0;
            x <= WIDTH;
            x += 24
        ) {

            ctx.beginPath();

            ctx.moveTo(
                x,
                0
            );

            ctx.lineTo(
                x,
                HEIGHT
            );

            ctx.stroke();

        }


        for (
            let y = 0;
            y <= HEIGHT;
            y += 24
        ) {

            ctx.beginPath();

            ctx.moveTo(
                0,
                y
            );

            ctx.lineTo(
                WIDTH,
                y
            );

            ctx.stroke();

        }

    }


    /* =========================================================
       DRAW ENERGY
    ========================================================= */

    function drawEnergy() {

        energie.forEach(
            item => {

                const pulse =
                    Math.sin(
                        item.pulse
                    ) *
                    3;

                ctx.save();

                ctx.shadowColor =
                    "#00eaff";

                ctx.shadowBlur =
                    15 + pulse;


                /* outer */

                ctx.fillStyle =
                    "#00eaff";

                ctx.beginPath();

                ctx.arc(
                    item.x,
                    item.y,
                    item.r + 1,
                    0,
                    Math.PI * 2
                );

                ctx.fill();


                /* inner */

                ctx.fillStyle =
                    "#dfffff";

                ctx.beginPath();

                ctx.arc(
                    item.x - 2,
                    item.y - 2,
                    item.r * 0.42,
                    0,
                    Math.PI * 2
                );

                ctx.fill();


                ctx.restore();

            }
        );

    }


    /* =========================================================
       DRAW OBSTACLES
    ========================================================= */

    function drawObstacles() {

        prekazky.forEach(
            p => {

                ctx.save();


                ctx.shadowColor =
                    "rgba(0,255,102,0.25)";

                ctx.shadowBlur = 7;


                /* STONE */

                ctx.fillStyle =
                    "#273449";

                ctx.fillRect(
                    p.x,
                    p.y,
                    p.w,
                    p.h
                );


                /* top moss */

                ctx.fillStyle =
                    "#00b34a";

                ctx.fillRect(
                    p.x,
                    p.y,
                    p.w,
                    4
                );


                /* highlights */

                ctx.fillStyle =
                    "rgba(255,255,255,0.08)";

                ctx.fillRect(
                    p.x + 4,
                    p.y + 6,
                    p.w - 8,
                    3
                );


                /* cracks */

                ctx.strokeStyle =
                    "#111827";

                ctx.lineWidth = 2;

                ctx.beginPath();

                ctx.moveTo(
                    p.x +
                    p.w * 0.35,
                    p.y + 3
                );

                ctx.lineTo(
                    p.x +
                    p.w * 0.45,
                    p.y + p.h
                );

                ctx.stroke();


                ctx.restore();

            }
        );

    }


    /* =========================================================
       DRAW SNAKE
    ========================================================= */

    function drawSnake() {

        if (
            hracHad.length === 0
        ) return;


        /*
        TAIL FIRST
        */

        for (
            let i =
                hracHad.length - 1;

            i >= 1;

            i--
        ) {

            const clanok =
                hracHad[i];

            const progress =
                1 -
                i /
                hracHad.length;

            const radius =
                5 +
                progress * 5;


            const gradient =
                ctx.createRadialGradient(
                    clanok.x - 2,
                    clanok.y - 2,
                    1,

                    clanok.x,
                    clanok.y,
                    radius
                );


            gradient.addColorStop(
                0,
                "#caff6a"
            );

            gradient.addColorStop(
                0.45,
                "#38ff68"
            );

            gradient.addColorStop(
                1,
                "#00a93d"
            );


            ctx.save();

            ctx.shadowColor =
                "#00ff66";

            ctx.shadowBlur = 9;

            ctx.fillStyle =
                gradient;

            ctx.beginPath();

            ctx.arc(
                clanok.x,
                clanok.y +
                i * 0.45,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.restore();

        }


        /*
        HEAD
        */

        const head =
            hracHad[0];


        ctx.save();

        ctx.shadowColor =
            "#00ff66";

        ctx.shadowBlur = 18;


        const headGradient =
            ctx.createRadialGradient(
                head.x - 5,
                head.y - 6,
                2,

                head.x,
                head.y,
                18
            );


        headGradient.addColorStop(
            0,
            "#dbff75"
        );

        headGradient.addColorStop(
            0.45,
            "#50ff6b"
        );

        headGradient.addColorStop(
            1,
            "#00a63e"
        );


        ctx.fillStyle =
            headGradient;


        ctx.beginPath();

        ctx.ellipse(
            head.x,
            head.y,
            17,
            15,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.restore();


        /*
        EYES
        */

        const eyeY =
            head.y - 4;


        ctx.fillStyle =
            "#ffffff";


        ctx.beginPath();

        ctx.arc(
            head.x - 6,
            eyeY,
            4.6,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            head.x + 6,
            eyeY,
            4.6,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.fillStyle =
            "#07100a";


        ctx.beginPath();

        ctx.arc(
            head.x - 5,
            eyeY,
            2.1,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            head.x + 7,
            eyeY,
            2.1,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
        SMILE
        */

        ctx.strokeStyle =
            "#06391e";

        ctx.lineWidth = 1.5;

        ctx.beginPath();

        ctx.arc(
            head.x,
            head.y + 1,
            6,
            0.15,
            Math.PI - 0.15
        );

        ctx.stroke();


        /*
        TONGUE
        */

        ctx.strokeStyle =
            "#ff365c";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(
            head.x + 16,
            head.y + 4
        );

        ctx.lineTo(
            head.x + 23,
            head.y + 5
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            head.x + 22,
            head.y + 5
        );

        ctx.lineTo(
            head.x + 26,
            head.y + 2
        );

        ctx.moveTo(
            head.x + 22,
            head.y + 5
        );

        ctx.lineTo(
            head.x + 26,
            head.y + 8
        );

        ctx.stroke();

    }


    /* =========================================================
       DRAW PARTICLES
    ========================================================= */

    function drawParticles() {

        particles.forEach(
            particle => {

                ctx.save();

                ctx.globalAlpha =
                    particle.life;

                ctx.fillStyle =
                    particle.color;

                ctx.shadowColor =
                    particle.color;

                ctx.shadowBlur =
                    8;

                ctx.beginPath();

                ctx.arc(
                    particle.x,
                    particle.y,
                    2.5,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

                ctx.restore();

            }
        );

    }


    /* =========================================================
       DRAW LEVEL EFFECT
    ========================================================= */

    function drawLevelIndicator() {

        ctx.save();

        ctx.font =
            "bold 11px Arial";

        ctx.textAlign =
            "center";

        ctx.fillStyle =
            "rgba(0,255,102,0.32)";

        ctx.fillText(
            "CYBER ZONE " +
            level,

            WIDTH / 2,

            24
        );

        ctx.restore();

    }


    /* =========================================================
       DRAW EVERYTHING
    ========================================================= */

    function drawGame() {

        drawBackground();

        drawEnergy();

        drawObstacles();

        drawSnake();

        drawParticles();

        drawLevelIndicator();

    }


    /* =========================================================
       GAME LOOP
    ========================================================= */

    function hernaSlucka() {

        if (!hraBezi) {

            return;
        }

        updateGame();

        if (!hraBezi) {

            return;
        }

        drawGame();

        gameLoopId =
            requestAnimationFrame(
                hernaSlucka
            );

    }


    /* =========================================================
       GAME OVER
    ========================================================= */

    function koniecHry() {

        if (!hraBezi) {

            return;
        }

        hraBezi = false;

        gameplayStop();

        zvukKoniec();


        if (
            gameLoopId
        ) {

            cancelAnimationFrame(
                gameLoopId
            );

            gameLoopId = null;

        }


        /* SAVE RECORD */

        if (
            skore >
            ulozeneBestScore
        ) {

            ulozeneBestScore =
                skore;

            localStorage.setItem(
                "snakeRunnerBest",
                ulozeneBestScore
            );

            document.getElementById(
                "best-score"
            ).innerText =
                ulozeneBestScore;

        }


        document.getElementById(
            "menuSub"
        ).innerHTML =
            "You crashed into an obstacle.<br>Can you beat your score?";


        let result =
            "SCORE: " +
            skore +
            " · LEVEL: " +
            level;


        if (
            skore ===
            ulozeneBestScore &&
            skore > 0
        ) {

            result +=
                "<br>🏆 NEW BEST!";

        }


        document.getElementById(
            "finalScore"
        ).innerHTML =
            result;


        document.getElementById(
            "startButton"
        ).innerText =
            "PLAY AGAIN";


        setTimeout(
            () => {

                document.getElementById(
                    "menuOverlay"
                ).style.display =
                    "flex";

            },
            350
        );

    }


    /* =========================================================
       DRAW INITIAL BACKGROUND
    ========================================================= */

    drawBackground();

</script>

</body>
